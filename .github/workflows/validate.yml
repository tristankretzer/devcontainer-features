name: "Validate devcontainer-feature.json files"
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # For a pull request this is the merge commit, whose first parent is the
      # tip of the base branch.
      - name: Checkout Git commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: "Check that changed features have an unpublished version"
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          base="HEAD^1"
          registry="https://ghcr.io"
          response="$(mktemp)"
          failed=false
          for file in src/*/devcontainer-feature.json; do
            dir="$(dirname "${file}")"
            feature="$(basename "${dir}")"

            # A feature that the pull request adds has no published version.
            if ! git cat-file -e "${base}:${file}" 2>/dev/null; then
              continue
            fi

            # The README is generated by the release workflow, after the
            # version it documents has been published.
            if git diff --quiet "${base}" HEAD -- "${dir}" ":(exclude)${dir}/README.md"; then
              continue
            fi

            version="$(jq -r '.version' "${file}")"
            package="${REPOSITORY,,}/${feature}"

            # The registry refuses a token for a package that does not exist,
            # which is the case as long as the feature has never been released.
            status="$(curl -sS -o "${response}" -w '%{http_code}' "${registry}/token?scope=repository:${package}:pull")"
            if [ "${status}" = "403" ]; then
              echo "::notice file=${file}::No public package found for feature '${feature}', so its version '${version}' counts as unpublished."
              continue
            fi
            if [ "${status}" != "200" ]; then
              echo "::error file=${file}::Requesting a token for the package of feature '${feature}' ended with status '${status}'."
              failed=true
              continue
            fi
            token="$(jq -r '.token' "${response}")"

            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "${registry}/v2/${package}/manifests/${version}")"
            case "${status}" in
              404)
                ;;
              200)
                echo "::error file=${file}::Feature '${feature}' changed, but its version '${version}' is already published. Without a new version the change is not released."
                failed=true
                ;;
              *)
                echo "::error file=${file}::Looking up version '${version}' of feature '${feature}' ended with status '${status}'."
                failed=true
                ;;
            esac
          done

          if [ "${failed}" = "true" ]; then
            exit 1
          fi
