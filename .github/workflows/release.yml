name: "Release dev container features & Generate Documentation"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout Git commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Publish Features"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR for Documentation
        id: push_image_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Start."
          # Configure git and Push updates
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git config --global user.name github-actions[bot]
          git config pull.rebase false
          branch="chore/automated-documentation-update-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          message='Automated documentation update'
          # The Dev Container CLI hard-codes "main" in the link to
          # devcontainer-feature.json, so point it at the released branch.
          sed -i "s#/blob/main/#/blob/${GITHUB_REF_NAME}/#" src/*/README.md
          # Add / update and commit
          git add src/*/README.md
          git commit -m "$message" || export NO_UPDATES=true
          # Push
          if [ "$NO_UPDATES" != "true" ] ; then
              git push origin "$branch"
              gh pr create --fill
          fi
