name: "CI - Test Features"
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  list-features:
    runs-on: ubuntu-24.04
    outputs:
      features: ${{ steps.list.outputs.features }}
      scenarios: ${{ steps.list.outputs.scenarios }}
      global: ${{ steps.list.outputs.global }}
    steps:
      - name: Checkout Git commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "List features and their tests"
        id: list
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Every directory in src/ with a devcontainer-feature.json is a feature.
          features=()
          # Features that additionally define scenarios in test/<feature>/.
          scenarios=()
          for file in src/*/devcontainer-feature.json; do
            feature="$(basename "$(dirname "${file}")")"
            features+=("${feature}")
            if [ -f "test/${feature}/scenarios.json" ]; then
              scenarios+=("${feature}")
            fi
          done

          global=false
          if [ -f test/_global/scenarios.json ]; then
            global=true
          fi

          {
            echo "features=$(jq -cn '$ARGS.positional' --args "${features[@]}")"
            echo "scenarios=$(jq -cn '$ARGS.positional' --args "${scenarios[@]}")"
            echo "global=${global}"
          } >> "$GITHUB_OUTPUT"

  test-autogenerated:
    needs: list-features
    if: needs.list-features.outputs.features != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.list-features.outputs.features) }}
        baseImage:
          - debian:latest
          - debian:bookworm
          - mcr.microsoft.com/devcontainers/base:debian
          - ubuntu:latest
          - ubuntu:24.04
          - ubuntu:22.04
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - name: Checkout Git commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: devcontainer features test --skip-scenarios -f "${FEATURE}" -i "${BASE_IMAGE}" .

  test-scenarios:
    needs: list-features
    if: needs.list-features.outputs.scenarios != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.list-features.outputs.scenarios) }}
    steps:
      - name: Checkout Git commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        env:
          FEATURE: ${{ matrix.features }}
        run: devcontainer features test -f "${FEATURE}" --skip-autogenerated --skip-duplicated .

  test-global:
    needs: list-features
    if: needs.list-features.outputs.global == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Git commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .

  # Single job to mark as required: the names of the matrix jobs above depend on
  # the features, and jobs skipped for lack of features must not block a merge.
  test-result:
    needs:
      - list-features
      - test-autogenerated
      - test-scenarios
      - test-global
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: "Check results of all test jobs"
        env:
          LIST_RESULT: ${{ needs.list-features.result }}
          TEST_RESULTS: ${{ needs.test-autogenerated.result }} ${{ needs.test-scenarios.result }} ${{ needs.test-global.result }}
        run: |
          set -euo pipefail

          if [ "${LIST_RESULT}" != "success" ]; then
            echo "::error::Listing the features ended with result '${LIST_RESULT}'."
            exit 1
          fi

          for result in ${TEST_RESULTS}; do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::At least one test job ended with result '${result}'."
              exit 1
            fi
          done
