config:
  default: true

  # Allow arbitrary line length.
  #
  # Reason: Markdown is written one sentence per line, so that changing a
  # sentence shows up as a single changed line in the diff. A sentence runs past
  # 80 characters easily, especially when it contains a link.
  MD013: false

# Skip the feature READMEs.
#
# Reason: They are generated by the Dev Container CLI and do not follow the
# lint rules. Their hand-written part lives in NOTES.md, which is linted.
ignores:
  - "src/*/README.md"
